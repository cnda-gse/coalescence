[profile]
location = "Seattle, WA"
width = 512

[template] # Type up your report below! In TOML, the first newline in a multiline literal is trimmed. Everything else is kept.
content = '''
┌──────────────────────────────────────────────────────────────┐
{{ height 4}}│{{width 4}}{{bold}}coalescence{{\bold}}{{width 1}}                  │{{height 1}}



├──────────────────────────────────────────────────────────────┤
│Printed {{#date "%Y-%m-%d %H:%M"}}                                      │
└──────────────────────────────────────────────────────────────┘
{{#location}}
{{ underline }}weather.rs{{ \underline }}                                         ᓚᘏᗢ ᶻ z Z
┌──────────────────────────────────────────────────────────────┐
{{ height 2}}│{{width 2}}{{bold}}Local Weather{{\bold}}{{width 1}}                                    │{{height 1}}

└──────────────────────────────────────────────────────────────┘
{{!weather}}
{{ underline }}astro.rs{{ \underline }}                                           ᓚᘏᗢ ᶻ z Z
┌──────────────────────────────────────────────────────────────┐
{{ height 2}}│{{width 2}}{{bold}}Space Weather{{\bold}}{{width 1}}                                    │{{height 1}}

└──────────────────────────────────────────────────────────────┘
{{!astro}}
'''
